# Copia este archivo como projects/MIPROYECTO.conf y ajustalo. Es bash: se carga con `source`.
# Los .conf reales NO se suben al repo (estan en .gitignore): pueden traer rutas privadas.

# Repo a desplegar. Privado: usa SSH con una deploy key de solo lectura.
REPO_URL="git@github.com:usuario/proyecto.git"
BRANCH="main"

# releases = cada deploy en su carpeta + symlink (atomico, rollback instantaneo)  [recomendado]
# rsync    = copia sobre la carpeta destino (como v1, sin sus fallas)
MODE="releases"

# Carpeta privada del deploy (fuera de public_html): repo/, releases/, shared/, current, history, deploy.log
BASE="$HOME/apps/proyecto"

# Lo que se publica. En releases es un symlink que crea el script; en rsync, una carpeta.
TARGET="$HOME/domains/midominio.com/public_html/proyecto"

# Subcarpeta del repo que se publica ("" = todo el repo). Nunca se publica .git.
SOURCE_DIR=""

# Archivos/carpetas que NO viven en git y deben sobrevivir a los deploys (config, uploads, cache...).
# Viven en $BASE/shared y se enlazan dentro de cada release. Carpeta = terminar en "/".
SHARED=( ".env" "uploads/" )

# Rutas del repo que no se publican (acepta comodines simples).
EXCLUDE=( "tests" "README.md" )

# Solo modo rsync: rutas del destino que nunca se borran ni se pisan (ademas de SHARED y del .gitignore).
PROTECT=()

# Releases que se guardan para rollback.
KEEP_RELEASES=5

# Revision antes de publicar (se corre dentro de la release nueva). Si falla, no se publica nada.
CHECK_CMD='find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -r -n1 php -l > /dev/null'

# Ganchos opcionales (bash). BEFORE_ACTIVATE corre en la release nueva; AFTER_ACTIVATE en la publicada.
BEFORE_ACTIVATE=""     # ej: composer install --no-dev --no-interaction
AFTER_ACTIVATE=""

# Revision despues de publicar. Si no responde lo esperado, se regresa sola a la release anterior.
HEALTH_URL="https://midominio.com/proyecto/"
HEALTH_EXPECT="200"    # varios: "200 302"
